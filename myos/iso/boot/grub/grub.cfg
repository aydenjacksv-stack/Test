# ============================================================
#  MyOS - Configuration GRUB2
#  Bootloader du système
# ============================================================

# Timeout (en secondes)
set timeout=5
set timeout_style=countdown

# Thème
set color_normal=light-cyan/black
set color_highlight=white/light-blue

# Menu principal
menuentry "MyOS v1.0 (démarrer)" {
    insmod multiboot
    insmod all_video

    # Charger le kernel
    multiboot /boot/myos.kernel
    boot
}

menuentry "MyOS v1.0 - Mode sans échec" {
    insmod multiboot
    multiboot /boot/myos.kernel nosafe
    boot
}

menuentry "Informations système" {
    insmod lspci
    insmod memrw
    echo "Architecture: i686 (x86 32-bit)"
    echo "Kernel: MyOS Custom Kernel v1.0"
    echo "Bootloader: GRUB2"
    echo ""
    echo "Appuyez sur ENTRÉE pour continuer..."
    sleep -i 9999
}
